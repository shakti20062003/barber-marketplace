services:
  - type: web
    name: trimly-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run prisma:generate && npm run migrate:deploy --workspace=database && npm run build:api
    startCommand: node backend/dist/main.js
    healthCheckPath: /api/cities
    envVars:
      - key: NODE_ENV
        value: development
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: trimly-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WEB_APP_URL
        value: http://localhost:3000
      - key: SEARCH_WEIGHT_DISTANCE
        value: 0.4
      - key: SEARCH_WEIGHT_RATING
        value: 0.4
      - key: SEARCH_WEIGHT_AVAILABILITY
        value: 0.2

databases:
  - name: trimly-db
    plan: free
